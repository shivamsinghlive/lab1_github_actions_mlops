name: Testing with Pytest
run-name: Pytest
on:
  push:
    branches:
      - main
      - 'releases/**' # Filters to run only when a push to a branch that matches the branches filter occurs
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows running the workflow manually from the Actions tab

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with ruff
      run: ruff check --output-format=github src test # Shows issues inline on the changed lines

  build:
    needs: lint # Only run tests once linting passes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests with coverage and generate XML report
      run: >
        python -m pytest
        --junitxml=pytest-report.xml
        --cov=src
        --cov-report=term-missing
        --cov-report=html
        --cov-fail-under=90
      continue-on-error: false

    - name: Write test and coverage summary
      if: always()
      run: |
        python .github/scripts/test_summary.py pytest-report.xml
        echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
        python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-py${{ matrix.python-version }}
        path: pytest-report.xml

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-py${{ matrix.python-version }}
        path: htmlcov/

    - name: Notify on success
      if: success()
      run: echo "Tests passed successfully"

    - name: Notify on failure
      if: failure()
      run: echo "Tests failed"
