line-length = 100
target-version = "py310"

[lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, B: common bug patterns
select = ["E", "W", "F", "I", "B"]

[lint.per-file-ignores]
# test_unittest.py adjusts sys.path before importing src so it can be run directly
"test/test_unittest.py" = ["E402"]
